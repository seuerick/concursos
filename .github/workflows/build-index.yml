name: Gerar índice do acervo

on:
  push:
    branches: [main]
    paths-ignore: ['data.json']

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Gerar data.json
        run: python scripts/gerar_indice.py

      - name: Commit se houver mudanças
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "Índice inalterado — nada a commitar"
          else
            git commit -m "Atualizar índice do acervo"
            git push
          fi
