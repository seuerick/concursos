<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Materiais de estudo para concursos públicos brasileiros — editais, provas, planos de estudo e desempenho, organizados por instituição.">
  <meta name="color-scheme" content="light dark">
  <title>Concursos · Materiais de Estudo</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
  <style>
    /* ================= Design System ================= */
    :root {
      --bg: #f4f6fb;
      --surface: #ffffff;
      --surface-2: #eef2f8;
      --text: #0f172a;
      --muted: #64748b;
      --accent: #4f46e5;
      --accent-2: #7c3aed;
      --border: #e2e8f0;
      --code-bg: #f1f5f9;
      --shadow-sm: 0 1px 2px rgba(15,23,42,.05);
      --shadow-md: 0 8px 30px rgba(15,23,42,.08);
      --shadow-lg: 0 20px 50px rgba(15,23,42,.12);
      --radius: 16px;
      --radius-sm: 10px;
      --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      --header-h: 68px;
      --grad: linear-gradient(135deg, var(--accent), var(--accent-2));
    }
    [data-theme="dark"] {
      --bg: #0a0f1e;
      --surface: #111827;
      --surface-2: #1b2437;
      --text: #e5eaf3;
      --muted: #8b98ad;
      --accent: #818cf8;
      --accent-2: #a78bfa;
      --border: #26324a;
      --code-bg: #0a0f1e;
      --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
      --shadow-md: 0 8px 30px rgba(0,0,0,.5);
      --shadow-lg: 0 20px 50px rgba(0,0,0,.6);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      transition: background .3s ease, color .3s ease;
    }
    a { color: var(--accent); }
    button { font-family: inherit; }
    ::selection { background: color-mix(in srgb, var(--accent) 30%, transparent); }

    /* ================= Header ================= */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 50;
      height: var(--header-h);
      background: color-mix(in srgb, var(--surface) 78%, transparent);
      backdrop-filter: blur(16px) saturate(1.4);
      -webkit-backdrop-filter: blur(16px) saturate(1.4);
      border-bottom: 1px solid var(--border);
    }
    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      height: 100%;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit; min-width: 0; }
    .brand-icon {
      font-size: 1.5rem;
      display: grid;
      place-items: center;
      width: 42px; height: 42px;
      background: var(--grad);
      color: #fff;
      border-radius: 12px;
      box-shadow: var(--shadow-sm);
    }
    .brand h1 { font-size: 1.1rem; margin: 0; line-height: 1.2; font-weight: 700; }
    .brand-sub { margin: 0; font-size: .75rem; color: var(--muted); }
    .header-actions { display: flex; align-items: center; gap: 10px; }

    .search-box { position: relative; display: flex; align-items: center; }
    .search-box svg {
      position: absolute; left: 14px; width: 16px; height: 16px;
      color: var(--muted); pointer-events: none;
    }
    .search-box input {
      width: min(340px, 42vw);
      padding: 10px 14px 10px 40px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface-2);
      color: var(--text);
      font-size: .9rem;
      outline: none;
      transition: border-color .2s, box-shadow .2s, background .2s, width .3s;
    }
    .search-box input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent);
      background: var(--surface);
    }
    .search-box input::placeholder { color: var(--muted); }

    .icon-btn {
      display: grid; place-items: center;
      width: 42px; height: 42px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface-2);
      color: var(--text);
      font-size: 1.05rem;
      cursor: pointer;
      transition: background .2s, transform .15s, border-color .2s;
    }
    .icon-btn:hover { background: var(--surface); border-color: var(--accent); transform: translateY(-1px); }
    .icon-btn:active { transform: scale(.94); }
    .icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* ================= Hero ================= */
    .hero {
      max-width: 1200px;
      margin: 0 auto;
      padding: 56px 24px 32px;
      text-align: center;
    }
    .hero .eyebrow {
      display: inline-block;
      font-size: .78rem;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--accent);
      background: color-mix(in srgb, var(--accent) 12%, transparent);
      padding: 6px 16px;
      border-radius: 999px;
      margin-bottom: 18px;
    }
    .hero h2 {
      font-size: clamp(1.8rem, 4.5vw, 3rem);
      margin: 0 0 12px;
      line-height: 1.15;
      letter-spacing: -.02em;
      background: var(--grad);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
    }
    .hero p { color: var(--muted); max-width: 560px; margin: 0 auto; font-size: 1.05rem; }
    .hero .stats { display: flex; justify-content: center; gap: 28px; margin-top: 28px; flex-wrap: wrap; }
    .hero .stat { text-align: center; }
    .hero .stat b { display: block; font-size: 1.5rem; background: var(--grad); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    .hero .stat span { font-size: .78rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }

    /* ================= Institution cards ================= */
    .grid {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px 40px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }
    .inst-card {
      position: relative;
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0;
      overflow: hidden;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      box-shadow: var(--shadow-sm);
      transition: transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s, border-color .25s;
    }
    .inst-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); border-color: transparent; }
    .inst-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .inst-card .topbar { height: 6px; }
    .inst-card .body { padding: 20px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
    .inst-card .inst-name {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: .02em;
      background: var(--card-grad, var(--grad));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
    }
    .inst-card .inst-full { font-size: .85rem; color: var(--muted); }
    .inst-card .meta { margin-top: auto; display: flex; align-items: center; justify-content: space-between; font-size: .8rem; color: var(--muted); }
    .inst-card .meta .chip { background: var(--surface-2); padding: 3px 12px; border-radius: 999px; font-weight: 600; }
    .inst-card .go { font-weight: 700; color: var(--accent); display: inline-flex; align-items: center; gap: 4px; }
    .inst-card .go::after { content: '→'; transition: transform .2s; }
    .inst-card:hover .go::after { transform: translateX(4px); }

    /* ================= Sub-content cards ================= */
    .sub-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
    }
    .sub-card {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      transition: transform .2s, box-shadow .2s, border-color .2s;
    }
    .sub-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: var(--accent); }
    .sub-card .ic { font-size: 1.4rem; flex-shrink: 0; }
    .sub-card .t { font-weight: 600; font-size: .92rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sub-card .s { font-size: .75rem; color: var(--muted); }

    /* ================= Breadcrumbs ================= */
    .crumbs {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px 24px 0;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px;
      font-size: .85rem;
    }
    .crumbs button {
      background: none; border: none; color: var(--muted);
      cursor: pointer; padding: 4px 8px; border-radius: 8px; font-size: .85rem;
      transition: color .15s, background .15s;
    }
    .crumbs button:hover { color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); }
    .crumbs .sep { color: var(--muted); opacity: .5; }
    .crumbs .current { color: var(--text); font-weight: 700; }

    .section-title {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 24px 12px;
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -.01em;
    }
    .section-title .sub { display: block; font-size: .85rem; font-weight: 400; color: var(--muted); margin-top: 4px; }

    /* ================= Skeleton ================= */
    .skeleton {
      background: linear-gradient(90deg, var(--surface-2) 25%, color-mix(in srgb, var(--surface-2) 60%, var(--surface)) 50%, var(--surface-2) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: var(--radius);
      height: 140px;
    }
    @keyframes shimmer { to { background-position: -200% 0; } }

    /* ================= File preview ================= */
    .view { max-width: 1200px; margin: 0 auto; padding: 0 24px 40px; }
    .file-header {
      display: flex; align-items: center; gap: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius) var(--radius) 0 0;
      padding: 16px 22px;
      flex-wrap: wrap;
    }
    .file-header .fname { font-weight: 700; font-size: 1rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-header .fpath { font-size: .75rem; color: var(--muted); font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-header .actions { margin-left: auto; display: flex; gap: 8px; flex-shrink: 0; }
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 16px; border-radius: 999px;
      border: 1px solid var(--border); background: var(--surface); color: var(--text);
      font-size: .82rem; cursor: pointer; text-decoration: none;
      transition: background .15s, border-color .15s, transform .15s;
    }
    .btn:hover { border-color: var(--accent); color: var(--accent); }
    .btn:active { transform: scale(.96); }
    .btn.primary { background: var(--grad); border: none; color: #fff; }
    .btn.primary:hover { filter: brightness(1.1); color: #fff; }

    .markdown-body {
      background: var(--surface);
      border: 1px solid var(--border);
      border-top: none;
      border-radius: 0 0 var(--radius) var(--radius);
      padding: 28px 32px;
      max-width: 100%;
    }
    .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4 { line-height: 1.3; margin: 1.4em 0 .6em; }
    .markdown-body h1 { font-size: 1.7rem; border-bottom: 1px solid var(--border); padding-bottom: .4em; }
    .markdown-body h2 { font-size: 1.35rem; border-bottom: 1px solid var(--border); padding-bottom: .3em; }
    .markdown-body h3 { font-size: 1.12rem; }
    .markdown-body p, .markdown-body ul, .markdown-body ol { margin: .6em 0; }
    .markdown-body code { font-family: var(--mono); font-size: .85em; background: var(--code-bg); padding: .15em .4em; border-radius: 6px; }
    .markdown-body pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px 16px; overflow-x: auto; line-height: 1.5; }
    .markdown-body pre code { background: none; padding: 0; }
    .markdown-body blockquote { margin: .8em 0; padding: .4em 1em; border-left: 4px solid var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; color: var(--muted); }
    .markdown-body table { border-collapse: collapse; width: 100%; margin: 1em 0; font-size: .9rem; }
    .markdown-body th, .markdown-body td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
    .markdown-body th { background: var(--surface-2); font-weight: 600; }
    .markdown-body tr:nth-child(even) td { background: color-mix(in srgb, var(--surface-2) 50%, transparent); }
    .markdown-body img { max-width: 100%; border-radius: var(--radius-sm); }
    .markdown-body hr { border: none; border-top: 1px solid var(--border); margin: 1.6em 0; }
    .markdown-body details { margin: .8em 0; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 0 14px; background: var(--surface-2); }
    .markdown-body summary { cursor: pointer; padding: 10px 0; font-weight: 600; }
    .markdown-body details[open] summary { border-bottom: 1px solid var(--border); margin-bottom: 10px; }

    .pdf-frame { width: 100%; height: calc(100vh - var(--header-h) - 60px); border: 1px solid var(--border); border-top: none; border-radius: 0 0 var(--radius) var(--radius); background: #525659; }
    .raw-pre { margin: 0; padding: 20px 24px; overflow-x: auto; font-family: var(--mono); font-size: .85rem; background: var(--code-bg); white-space: pre-wrap; word-break: break-word; border: 1px solid var(--border); border-top: none; border-radius: 0 0 var(--radius) var(--radius); }

    /* ================= Search results ================= */
    .search-panel {
      max-width: 1200px; margin: 0 auto; padding: 0 24px 40px;
      display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px;
    }
    .result {
      display: flex; align-items: center; gap: 12px;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
      padding: 12px 16px; cursor: pointer; text-decoration: none; color: inherit;
      transition: transform .15s, border-color .15s, box-shadow .15s;
    }
    .result:hover { transform: translateY(-2px); border-color: var(--accent); box-shadow: var(--shadow-md); }
    .result .rname { font-weight: 600; font-size: .9rem; }
    .result .rpath { font-size: .72rem; color: var(--muted); font-family: var(--mono); }
    .result mark { background: color-mix(in srgb, var(--accent) 30%, transparent); color: inherit; border-radius: 3px; padding: 0 2px; }

    /* ================= States ================= */
    .state { max-width: 1200px; margin: 0 auto; padding: 60px 24px; text-align: center; color: var(--muted); }
    .state.error { color: #ef4444; }
    .state .big { font-size: 3rem; margin-bottom: 12px; }
    .state h3 { color: var(--text); margin: 0 0 6px; }

    /* ================= Footer ================= */
    .site-footer {
      max-width: 1200px; margin: 0 auto; padding: 24px 24px 40px;
      color: var(--muted); font-size: .8rem; text-align: center;
      border-top: 1px solid var(--border);
    }

    /* ================= Toast ================= */
    .toast {
      position: fixed; bottom: 20px; left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--text); color: var(--bg);
      padding: 10px 20px; border-radius: 999px; font-size: .85rem;
      opacity: 0; pointer-events: none;
      transition: opacity .25s, transform .25s; z-index: 100; box-shadow: var(--shadow-md);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ================= View transition ================= */
    .fade-in { animation: fadeIn .3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    /* ================= Responsive ================= */
    @media (max-width: 720px) {
      .header-inner { padding: 0 16px; }
      .brand-sub { display: none; }
      .search-box input { width: 100%; }
      .hero { padding: 40px 16px 24px; }
      .grid, .view, .crumbs, .section-title, .search-panel { padding-left: 16px; padding-right: 16px; }
      .markdown-body { padding: 20px; }
      .file-header .actions { width: 100%; }
    }
    @media (max-width: 480px) {
      .search-box { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="#" id="brandLink" aria-label="Início">
        <span class="brand-icon" aria-hidden="true">📚</span>
        <span>
          <h1>Concursos</h1>
          <p class="brand-sub">Materiais de estudo · Cebraspe</p>
        </span>
      </a>
      <div class="header-actions">
        <div class="search-box" role="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="search" id="searchInput" placeholder="Buscar em todo o acervo…" autocomplete="off" aria-label="Buscar em todo o acervo">
        </div>
        <button class="icon-btn" id="themeToggle" aria-label="Alternar tema claro/escuro" title="Alternar tema">🌙</button>
      </div>
    </div>
  </header>

  <main id="app" aria-live="polite"></main>

  <footer class="site-footer">
    <p>Materiais de estudo para concursos públicos · Índice gerado automaticamente a cada atualização</p>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js" defer></script>
  <script>
  'use strict';
  /* ================= Config ================= */
  const REPO = 'seuerick/concursos';
  const API = `https://api.github.com/repos/${REPO}/contents/`;
  const RAW = `https://raw.githubusercontent.com/${REPO}/main/`;
  const IGNORED = new Set(['.git', '.github', 'node_modules', 'index.html', '.gitignore', 'agent.py', 'ANALISE_PADRAO_TI_TCE_TCU.md', 'data.json', 'scripts']);
  const EXT_ICON = { md: '📝', pdf: '📄', html: '🌐', txt: '📃', json: '🧾', csv: '📊', xlsx: '📗', docx: '📘', pptx: '📙', zip: '🗜️', png: '🖼️', jpg: '🖼️', jpeg: '🖼️', svg: '🖼️' };

  const INST_INFO = {
    bacen: { full: 'Banco Central do Brasil', grad: 'linear-gradient(135deg,#2563eb,#06b6d4)' },
    camara: { full: 'Câmara dos Deputados', grad: 'linear-gradient(135deg,#059669,#84cc16)' },
    cgu: { full: 'Controladoria-Geral da União', grad: 'linear-gradient(135deg,#7c3aed,#ec4899)' },
    pf: { full: 'Polícia Federal', grad: 'linear-gradient(135deg,#dc2626,#f97316)' },
    tce: { full: 'Tribunal de Contas do Estado', grad: 'linear-gradient(135deg,#0d9488,#22d3ee)' },
    tcu: { full: 'Tribunal de Contas da União', grad: 'linear-gradient(135deg,#ea580c,#facc15)' },
    tse: { full: 'Tribunal Superior Eleitoral', grad: 'linear-gradient(135deg,#db2777,#8b5cf6)' }
  };

  const state = { tree: null, currentPath: null, searchIndex: [] };
  const $ = (s) => document.querySelector(s);
  const app = $('#app');
  const searchInput = $('#searchInput');
  const themeToggle = $('#themeToggle');

  /* ================= Helpers ================= */
  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function fileIcon(name) { const ext = name.split('.').pop().toLowerCase(); return EXT_ICON[ext] || '📄'; }
  function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
  function toast(msg) {
    const el = $('#toast');
    el.textContent = msg; el.classList.add('show');
    clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 2200);
  }
  async function fetchJson(url) {
    const res = await fetch(url, { headers: { 'Accept': 'application/vnd.github+json' } });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return res.json();
  }
  function instGrad(name) { return (INST_INFO[name] && INST_INFO[name].grad) || 'var(--grad)'; }
  function instFull(name) { return (INST_INFO[name] && INST_INFO[name].full) || name.toUpperCase(); }
  function countFiles(items) { return items.reduce((n, it) => n + (it.type === 'dir' ? countFiles(it.children || []) : 1), 0); }
  function countDirs(items) { return items.reduce((n, it) => n + (it.type === 'dir' ? 1 + countDirs(it.children || []) : 0), 0); }

  /* ================= Theme ================= */
  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    themeToggle.textContent = t === 'dark' ? '☀️' : '🌙';
    themeToggle.setAttribute('aria-label', t === 'dark' ? 'Ativar tema claro' : 'Ativar tema escuro');
  }
  function initTheme() {
    const saved = localStorage.getItem('theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    applyTheme(saved || (prefersDark ? 'dark' : 'light'));
  }
  themeToggle.addEventListener('click', () => {
    const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    applyTheme(next); localStorage.setItem('theme', next);
  });
  $('#brandLink').addEventListener('click', (e) => { e.preventDefault(); goHome(); });

  /* ================= Data loading (auto-listing) ================= */
  async function buildTree(url) {
    const entries = await fetchJson(url);
    const result = [];
    for (const entry of entries) {
      if (IGNORED.has(entry.name)) continue;
      if (entry.type === 'dir') {
        const children = await buildTree(entry.url);
        result.push({ name: entry.name, type: 'dir', children });
      } else {
        result.push({ name: entry.name, type: 'file', size: entry.size, download_url: entry.download_url });
      }
    }
    return result;
  }

  async function loadTree() {
    // Fonte primária: data.json estático (sem rate limit, confiável no GitHub Pages)
    try {
      const res = await fetch('data.json', { cache: 'no-cache' });
      if (res.ok) {
        const data = await res.json();
        if (data && Array.isArray(data.tree)) {
          state.tree = data.tree;
          buildSearchIndex(state.tree, '');
          return true;
        }
      }
    } catch (err) {
      console.warn('data.json indisponível, usando API:', err);
    }
    // Fallback: API do GitHub (útil em desenvolvimento local)
    try {
      state.tree = await buildTree(API);
      buildSearchIndex(state.tree, '');
      return true;
    } catch (err) {
      console.error(err);
      return false;
    }
  }

  function buildSearchIndex(items, basePath) {
    for (const item of items) {
      const path = basePath ? `${basePath}/${item.name}` : item.name;
      if (item.type === 'dir') buildSearchIndex(item.children || [], path);
      else state.searchIndex.push({ name: item.name, path });
    }
  }

  function findNode(items, path) {
    const parts = path.split('/');
    let node = null, list = items;
    for (const part of parts) {
      node = list.find((it) => it.name === part);
      if (!node) return null;
      list = node.children || [];
    }
    return node;
  }

  /* ================= Views ================= */
  function renderSkeletons(n = 6) {
    app.innerHTML = `<div class="grid">${'<div class="skeleton"></div>'.repeat(n)}</div>`;
  }

  function goHome() {
    state.currentPath = null;
    searchInput.value = '';
    renderHome();
  }

  function renderHome() {
    if (!state.tree) { renderSkeletons(); return; }
    const insts = state.tree.filter((it) => it.type === 'dir');
    const totalFiles = countFiles(state.tree);
    const totalDirs = countDirs(state.tree);
    const cards = insts.map((inst) => {
      const files = countFiles(inst.children || []);
      const dirs = countDirs(inst.children || []);
      const grad = instGrad(inst.name);
      return `<a class="inst-card fade-in" href="#" data-path="${escapeHtml(inst.name)}" style="--card-grad:${grad}">
        <div class="topbar" style="background:${grad}"></div>
        <div class="body">
          <div class="inst-name">${escapeHtml(inst.name.toUpperCase())}</div>
          <div class="inst-full">${escapeHtml(instFull(inst.name))}</div>
          <div class="meta">
            <span class="chip">${files} arquivo${files === 1 ? '' : 's'} · ${dirs} pasta${dirs === 1 ? '' : 's'}</span>
            <span class="go">Explorar</span>
          </div>
        </div>
      </a>`;
    }).join('');

    app.innerHTML = `
      <section class="hero fade-in">
        <span class="eyebrow">Acervo de estudos</span>
        <h2>Materiais para concursos públicos</h2>
        <p>Editais, provas, planos de estudo e acompanhamento de desempenho — organizados por instituição e atualizados automaticamente.</p>
        <div class="stats">
          <div class="stat"><b>${insts.length}</b><span>Instituições</span></div>
          <div class="stat"><b>${totalDirs}</b><span>Pastas</span></div>
          <div class="stat"><b>${totalFiles}</b><span>Arquivos</span></div>
        </div>
      </section>
      <div class="grid">${cards}</div>`;

    app.querySelectorAll('.inst-card').forEach((c) => {
      c.addEventListener('click', (e) => { e.preventDefault(); openDir(c.dataset.path); });
    });
  }

  function renderBreadcrumbs(path) {
    if (!path) return '';
    const parts = path.split('/');
    let acc = '';
    let html = '<button data-go="root">Início</button>';
    parts.forEach((part, i) => {
      acc = acc ? `${acc}/${part}` : part;
      html += '<span class="sep" aria-hidden="true">/</span>';
      if (i === parts.length - 1) html += `<span class="current">${escapeHtml(part)}</span>`;
      else html += `<button data-go="${escapeHtml(acc)}">${escapeHtml(part)}</button>`;
    });
    return `<nav class="crumbs" aria-label="Trilha de navegação">${html}</nav>`;
  }

  function openDir(path) {
    state.currentPath = path;
    searchInput.value = '';
    const node = findNode(state.tree, path);
    if (!node) { renderError('Pasta não encontrada.'); return; }
    const isRoot = path.split('/').length === 1;
    const grad = instGrad(path.split('/')[0]);
    const crumbs = renderBreadcrumbs(path);

    const dirs = (node.children || []).filter((it) => it.type === 'dir');
    const files = (node.children || []).filter((it) => it.type === 'file');

    const dirCards = dirs.map((d) => {
      const p = `${path}/${d.name}`;
      const n = countFiles(d.children || []);
      return `<a class="sub-card fade-in" href="#" data-path="${escapeHtml(p)}">
        <span class="ic" aria-hidden="true">📁</span>
        <div style="min-width:0"><div class="t">${escapeHtml(d.name)}</div><div class="s">${n} arquivo${n === 1 ? '' : 's'}</div></div>
      </a>`;
    }).join('');

    const fileCards = files.map((f) => {
      const p = `${path}/${f.name}`;
      return `<a class="sub-card fade-in" href="#" data-path="${escapeHtml(p)}">
        <span class="ic" aria-hidden="true">${fileIcon(f.name)}</span>
        <div style="min-width:0"><div class="t">${escapeHtml(f.name)}</div><div class="s">${f.size ? Math.round(f.size / 1024) + ' KB' : 'arquivo'}</div></div>
      </a>`;
    }).join('');

    const title = isRoot
      ? `<h2 class="section-title fade-in" style="background:${grad};-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent">${escapeHtml(node.name.toUpperCase())}<span class="sub" style="-webkit-text-fill-color:var(--muted);color:var(--muted)">${escapeHtml(instFull(node.name))}</span></h2>`
      : `<h2 class="section-title fade-in">${escapeHtml(node.name)}<span class="sub">${dirs.length} pasta${dirs.length === 1 ? '' : 's'} · ${files.length} arquivo${files.length === 1 ? '' : 's'}</span></h2>`;

    app.innerHTML = crumbs + title + `<div class="view fade-in"><div class="sub-grid">${dirCards}${fileCards}</div></div>`;

    app.querySelectorAll('.sub-card').forEach((c) => {
      c.addEventListener('click', (e) => {
        e.preventDefault();
        const p = c.dataset.path;
        const node2 = findNode(state.tree, p);
        if (node2 && node2.type === 'dir') openDir(p);
        else openFile(p);
      });
    });
    app.querySelectorAll('.crumbs button[data-go]').forEach((b) => {
      b.addEventListener('click', () => {
        const t = b.dataset.go;
        if (t === 'root') goHome();
        else openDir(t);
      });
    });
  }

  function renderError(msg) {
    app.innerHTML = `<div class="state error fade-in"><div class="big">⚠️</div><h3>Ops!</h3><p>${escapeHtml(msg)}</p></div>`;
  }

  /* ================= File preview ================= */
  async function openFile(path) {
    state.currentPath = path;
    const crumbs = renderBreadcrumbs(path);
    app.innerHTML = crumbs + `<div class="view"><div class="skeleton" style="height:60vh"></div></div>`;
    const name = path.split('/').pop();
    const ext = name.split('.').pop().toLowerCase();
    const rawUrl = RAW + encodeURIComponent(path);
    try {
      if (ext === 'md') {
        const text = await (await fetch(rawUrl)).text();
        renderMarkdown(name, path, text);
      } else if (ext === 'pdf') {
        renderPdf(name, path, rawUrl);
      } else {
        const text = await (await fetch(rawUrl)).text();
        renderRaw(name, path, text);
      }
    } catch (err) {
      console.error(err);
      renderError('Não foi possível abrir o arquivo.');
    }
  }

  function fileHeader(name, path, extra) {
    return `<div class="file-header">
      <div style="min-width:0">
        <div class="fname">${fileIcon(name)} ${escapeHtml(name)}</div>
        <div class="fpath">${escapeHtml(path)}</div>
      </div>
      <div class="actions">
        <a class="btn" href="${RAW}${encodeURIComponent(path)}" target="_blank" rel="noopener">Abrir no GitHub ↗</a>
        ${extra || ''}
      </div>
    </div>`;
  }

  function ensureMarkdownLibs() {
    return new Promise((resolve) => {
      if (window.marked && window.DOMPurify) return resolve(true);
      const start = Date.now();
      const check = () => {
        if (window.marked && window.DOMPurify) resolve(true);
        else if (Date.now() - start > 5000) resolve(false);
        else setTimeout(check, 100);
      };
      check();
    });
  }

  async function renderMarkdown(name, path, text) {
    const header = fileHeader(name, path, `<a class="btn primary" href="${RAW}${encodeURIComponent(path)}" download>Baixar</a>`);
    app.innerHTML = renderBreadcrumbs(path) + `<div class="view fade-in">${header}<div class="markdown-body" id="mdBody"></div></div>`;
    const body = $('#mdBody');
    const ready = await ensureMarkdownLibs();
    if (ready) {
      body.innerHTML = window.DOMPurify.sanitize(window.marked.parse(text, { gfm: true, breaks: true }));
    } else {
      body.innerHTML = `<pre class="raw-pre">${escapeHtml(text)}</pre>`;
    }
  }

  function renderPdf(name, path, url) {
    const header = fileHeader(name, path, `<a class="btn primary" href="${url}" target="_blank" rel="noopener">Abrir PDF ↗</a>`);
    app.innerHTML = renderBreadcrumbs(path) + `<div class="view fade-in">${header}<iframe class="pdf-frame" src="${url}" title="${escapeHtml(name)}"></iframe></div>`;
  }

  function renderRaw(name, path, text) {
    const header = fileHeader(name, path, `<a class="btn primary" href="${RAW}${encodeURIComponent(path)}" download>Baixar</a>`);
    app.innerHTML = renderBreadcrumbs(path) + `<div class="view fade-in">${header}<pre class="raw-pre">${escapeHtml(text)}</pre></div>`;
  }

  /* ================= Search ================= */
  function renderSearch(query) {
    const q = query.toLowerCase();
    const results = state.searchIndex.filter((f) => f.name.toLowerCase().includes(q) || f.path.toLowerCase().includes(q));
    if (!results.length) {
      app.innerHTML = `<div class="state fade-in"><div class="big">🔍</div><h3>Nenhum resultado</h3><p>Nada encontrado para “${escapeHtml(query)}”.</p></div>`;
      return;
    }
    const cards = results.map((r) => {
      const idx = r.name.toLowerCase().indexOf(q);
      const name = idx >= 0
        ? escapeHtml(r.name.slice(0, idx)) + '<mark>' + escapeHtml(r.name.slice(idx, idx + q.length)) + '</mark>' + escapeHtml(r.name.slice(idx + q.length))
        : escapeHtml(r.name);
      return `<a class="result fade-in" href="#" data-path="${escapeHtml(r.path)}">
        <span class="ic" aria-hidden="true" style="font-size:1.3rem">${fileIcon(r.name)}</span>
        <div style="min-width:0"><div class="rname">${name}</div><div class="rpath">${escapeHtml(r.path)}</div></div>
      </a>`;
    }).join('');
    app.innerHTML = `<div class="section-title fade-in">Resultados para “${escapeHtml(query)}”<span class="sub">${results.length} encontrado${results.length === 1 ? '' : 's'}</span></div>
      <div class="search-panel">${cards}</div>`;
    app.querySelectorAll('.result').forEach((el) => {
      el.addEventListener('click', (e) => {
        e.preventDefault();
        searchInput.value = '';
        openFile(el.dataset.path);
      });
    });
  }

  searchInput.addEventListener('input', debounce((e) => {
    const q = e.target.value.trim();
    if (!q) { renderHome(); return; }
    renderSearch(q);
  }, 200));

  /* ================= Init ================= */
  document.addEventListener('DOMContentLoaded', async () => {
    initTheme();
    renderSkeletons();
    const ok = await loadTree();
    if (!ok) {
      renderError('Não foi possível carregar o acervo. Verifique se o repositório está publicado e acessível no GitHub.');
      return;
    }
    renderHome();
  });
  </script>
</body>
</html>
